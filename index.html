<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/img/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>知空空的空想世界</title>
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
  </head>
  <body class="bg-gray-50 font-sans text-gray-900">
    <div id="app" class="container mx-auto px-2 py-8">
      <!-- 头部区域 -->
      <header id="page-header" class="flex flex-col md:flex-row justify-between items-center mb-12 fade-in">
        <!-- 头部内容将通过 JavaScript 动态注入 -->
      </header>

      <!-- 网格卡片容器 -->
      <div class="grid-container grid gap-4 auto-rows-min">
        <!-- 卡片将通过 JavaScript 动态注入 -->
      </div>

      <!-- 页脚区域 -->
      <footer class="mt-16 text-center text-sm">
        <div id="page-footer">
          <p id="made-by"></p>
          <p id="powered-by"></p>
          <p id="inspired-by"></p>
          <p class="text-gray-600 text-sm" id="copyright"></p>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=f79674766531d46a40852dc77860ba25"></script>
  </body>
</html>
